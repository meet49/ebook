# Render Blueprint for ReadnShare's API. The website runs on Vercel, which forwards /api/*
# here, so Render runs only this service (every service in a workspace shares its free
# bandwidth and instance hours).
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for during setup; never commit real secrets to this file.
# Full walkthrough: docs/DEPLOY-RENDER.md

services:
  # ─── API (Express) ─────────────────────────────────────────────────────
  - type: web
    name: readnshare-api
    runtime: node
    region: singapore
    # Free plan works with the memory settings below; upgrade to "standard" (2 GB) for large books.
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @ebook/api
    startCommand: node --enable-source-maps apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Requests arrive via Vercel (the website) and then Render's proxy.
      # Keep memory inside the free plan's 512 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # Linux (glibc) keeps fragmented native memory per thread arena; 2 arenas keeps it low.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MAX_PDF_MB
        value: "60"
      - key: TRUST_PROXY
        value: "2"
      - key: APP_SECRET
        generateValue: true
      # The public website address (used in email links and to validate request origins).
      - key: APP_URL
        value: https://readnshare.in
      # The www variant is accepted too, in case someone reaches the site through it.
      - key: ALLOWED_ORIGINS
        value: https://www.readnshare.in
      - key: MONGODB_URI
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      # Backblaze B2: the region in the endpoint, e.g. us-east-005. Cloudflare R2: auto.
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Brevo HTTPS API: works on Render free, where SMTP ports are blocked.
      - key: EMAIL_TRANSPORT
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ReadnShare <no-reply@readnshare.in>
      # Razorpay keys can instead be added later in Admin → Settings.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ATTRIBUTION_WINDOW_DAYS
        value: "30"
      - key: COMMISSION_HOLD_DAYS
        value: "7"
      - key: MIN_PAYOUT_PAISE
        value: "50000"
