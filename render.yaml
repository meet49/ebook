# Render Blueprint for ReadnShare — two web services from this monorepo.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for during setup; never commit real secrets to this file.
# Full walkthrough: docs/DEPLOY-RENDER.md

services:
  # ─── API (Express) ─────────────────────────────────────────────────────
  - type: web
    name: readnshare-api
    runtime: node
    region: singapore
    # PDF rendering needs memory: use at least "standard" (2 GB) for real eBooks.
    plan: standard
    buildCommand: npm ci --include=dev && npm run build --workspace @ebook/api
    startCommand: node --enable-source-maps apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Requests arrive via Render's proxy, the web service, and Render's proxy again.
      - key: TRUST_PROXY
        value: "2"
      - key: APP_SECRET
        generateValue: true
      # Public URL of the web service, e.g. https://readnshare-web.onrender.com
      - key: APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Razorpay keys can instead be added later in Admin → Settings.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ATTRIBUTION_WINDOW_DAYS
        value: "30"
      - key: COMMISSION_HOLD_DAYS
        value: "7"
      - key: MIN_PAYOUT_PAISE
        value: "50000"

  # ─── Website (Next.js) ─────────────────────────────────────────────────
  - type: web
    name: readnshare-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build --workspace @ebook/web
    startCommand: npm run start --workspace @ebook/web
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Public URL of the API service, e.g. https://readnshare-api.onrender.com
      # (needed at BUILD time: Next.js bakes the /api rewrite into the build).
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        value: ReadnShare
